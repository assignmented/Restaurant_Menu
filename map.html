<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Location Picker — Example</title>
<style>
  :root{
    --black:#15120f;
    --black-2:#1d1815;
    --gold:#c9a24b;
    --gold-soft:#e6cd85;
    --wine:#8c3038;
    --wine-soft:#a83f47;
    --cream:#f4ecdc;
    --muted:#a89a85;
    --line:rgba(244,236,220,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--black); color:var(--cream);
    font-family:'Work Sans', Arial, sans-serif;
    padding:32px 20px; display:flex; justify-content:center;
  }
  .picker{
    width:100%; max-width:520px; background:var(--black-2);
    border:1px solid var(--line); border-radius:4px; padding:24px;
  }
  h2{font-size:20px; margin-bottom:6px;}
  .sub{color:var(--muted); font-size:13px; margin-bottom:18px;}

  .row{display:flex; gap:8px; margin-bottom:12px;}
  #addressInput{
    flex:1; padding:11px 12px; background:var(--black); border:1px solid var(--line);
    color:var(--cream); font-size:14px; border-radius:4px;
  }
  #addressInput:focus{outline:2px solid var(--gold); border-color:var(--gold);}
  .locate-btn{
    padding:11px 14px; background:transparent; border:1px solid var(--gold);
    color:var(--gold); font-size:13px; border-radius:4px; cursor:pointer; white-space:nowrap;
  }
  .locate-btn:hover{background:var(--gold); color:var(--black);}

  #map{
    width:100%; height:320px; border-radius:4px; margin-bottom:14px;
    background:#2a2a2a; /* shows while the map tiles load */
  }

  .result{
    font-size:13px; color:var(--muted); line-height:1.5; margin-bottom:16px;
    padding:12px; background:var(--black); border:1px solid var(--line); border-radius:4px;
  }
  .result strong{color:var(--cream); display:block; margin-bottom:4px; font-size:14px;}

  .confirm-btn{
    width:100%; padding:13px; background:var(--wine); border:1px solid var(--wine-soft);
    color:var(--cream); font-size:13px; letter-spacing:0.05em; text-transform:uppercase;
    border-radius:4px; cursor:pointer;
  }
  .confirm-btn:hover{background:var(--wine-soft);}
  .confirm-btn:disabled{opacity:0.4; cursor:not-allowed;}

  .hint{font-size:12px; color:var(--muted); margin-top:10px; text-align:center;}
</style>
</head>
<body>

<div class="picker">
  <h2>Pin your delivery location</h2>
  <p class="sub">Search an address, drag the pin, or use your current location.</p>

  <div class="row">
    <input id="addressInput" type="text" placeholder="Search for an address or area…">
    <button class="locate-btn" onclick="useMyLocation()">📍 Use my location</button>
  </div>

  <div id="map"></div>

  <div class="result" id="result">
    <strong>No location selected yet</strong>
    Drag the pin on the map, or search above, to set your delivery address.
  </div>

  <button class="confirm-btn" id="confirmBtn" disabled onclick="confirmLocation()">
    Confirm delivery location
  </button>

  <p class="hint">Lat/Lng and address are captured in hidden fields you can submit with the order.</p>

  <!-- These would actually be submitted with the order form -->
  <input type="hidden" id="deliveryLat">
  <input type="hidden" id="deliveryLng">
  <input type="hidden" id="deliveryAddress">
</div>

<script>
  let map, marker, geocoder, autocomplete;

  // Fallback centre if geolocation is unavailable — set this to your town/city centre.
  const DEFAULT_CENTER = { lat: 0.0470, lng: 37.6559 }; // Meru, Kenya

  function initMap() {
    geocoder = new google.maps.Geocoder();

    map = new google.maps.Map(document.getElementById('map'), {
      center: DEFAULT_CENTER,
      zoom: 15,
      disableDefaultUI: true,
      zoomControl: true,
      styles: [ /* optional: paste a Google Maps "styled map" JSON here to match your brand */ ]
    });

    marker = new google.maps.Marker({
      position: DEFAULT_CENTER,
      map: map,
      draggable: true,
      title: 'Drag to your exact delivery spot'
    });

    // Reverse-geocode whenever the pin is dropped or dragged
    marker.addListener('dragend', () => reverseGeocode(marker.getPosition()));

    // Clicking anywhere on the map moves the pin there
    map.addListener('click', (e) => {
      marker.setPosition(e.latLng);
      reverseGeocode(e.latLng);
    });

    // Address search box (Places Autocomplete)
    const input = document.getElementById('addressInput');
    autocomplete = new google.maps.places.Autocomplete(input);
    autocomplete.bindTo('bounds', map);
    autocomplete.addListener('place_changed', () => {
      const place = autocomplete.getPlace();
      if (!place.geometry) return;
      map.setCenter(place.geometry.location);
      map.setZoom(17);
      marker.setPosition(place.geometry.location);
      setResult(place.formatted_address, place.geometry.location);
    });

    // Set an initial reverse-geocoded address for the default pin
    reverseGeocode(marker.getPosition());
  }

  function reverseGeocode(latLng) {
    geocoder.geocode({ location: latLng }, (results, status) => {
      if (status === 'OK' && results[0]) {
        setResult(results[0].formatted_address, latLng);
      } else {
        setResult('Address not found — pin is still saved by coordinates.', latLng);
      }
    });
  }

  function setResult(address, latLng) {
    const lat = typeof latLng.lat === 'function' ? latLng.lat() : latLng.lat;
    const lng = typeof latLng.lng === 'function' ? latLng.lng() : latLng.lng;

    document.getElementById('result').innerHTML =
      `<strong>${address}</strong>Lat ${lat.toFixed(5)}, Lng ${lng.toFixed(5)}`;

    document.getElementById('deliveryLat').value = lat;
    document.getElementById('deliveryLng').value = lng;
    document.getElementById('deliveryAddress').value = address;
    document.getElementById('confirmBtn').disabled = false;
  }

  function useMyLocation() {
    if (!navigator.geolocation) {
      alert('Geolocation is not supported by this browser.');
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const latLng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        map.setCenter(latLng);
        map.setZoom(17);
        marker.setPosition(latLng);
        reverseGeocode(latLng);
      },
      () => alert('Could not get your location. Please allow location access, or search/drag the pin instead.')
    );
  }

  function confirmLocation() {
    const lat = document.getElementById('deliveryLat').value;
    const lng = document.getElementById('deliveryLng').value;
    const address = document.getElementById('deliveryAddress').value;

    // In production: send these along with the rest of the order payload, e.g.
    // fetch('/api/orders', { method: 'POST', body: JSON.stringify({ ...order, deliveryLat: lat, deliveryLng: lng, deliveryAddress: address }) })

    alert(`Delivery location confirmed:\n${address}\n(${lat}, ${lng})`);
  }
</script>

<!--
  Replace YOUR_GOOGLE_MAPS_API_KEY below with a real key from the Google Cloud Console.
  Required APIs enabled on that key: Maps JavaScript API, Geocoding API, Places API.
  Restrict the key to your domain in production.
-->
<script async
  src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=places&callback=initMap">
</script>

</body>
</html>
